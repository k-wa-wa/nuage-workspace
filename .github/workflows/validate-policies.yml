name: Validate Policies and Workflows

on:
  push:
    branches:
      - master
    paths:
      - "policies/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "policies/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  policy-test:
    name: Rego Policy Unit Tests & Workflow Lint
    runs-on: ubuntu-latest
    env:
      OPA_VERSION: "v1.16.2"
      CONFTEST_VERSION: "v0.71.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache policy tools
        uses: actions/cache@v4
        with:
          path: ~/.local/nuage-policy-tools
          key: nuage-policy-tools-${{ runner.os }}-${{ env.OPA_VERSION }}-${{ env.CONFTEST_VERSION }}

      - name: Install OPA and Conftest
        run: |
          set -euo pipefail
          BIN_DIR="$HOME/.local/nuage-policy-tools"
          mkdir -p "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"

          if [ ! -x "$BIN_DIR/opa" ]; then
            curl -sSfL "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static" \
              -o "$BIN_DIR/opa"
            chmod +x "$BIN_DIR/opa"
          fi

          if [ ! -x "$BIN_DIR/conftest" ]; then
            CONFTEST_VER_NO_V="${CONFTEST_VERSION#v}"
            curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/${CONFTEST_VERSION}/conftest_${CONFTEST_VER_NO_V}_Linux_x86_64.tar.gz" \
              | tar -xz -C "$BIN_DIR" conftest
          fi

          if ! command -v yamllint >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends yamllint
          fi

          "$BIN_DIR/opa" version
          "$BIN_DIR/conftest" --version
          yamllint --version

      - name: Run OPA unit tests
        run: opa test policies/k8s -v

      - name: Run Conftest verify
        run: conftest verify -p policies/k8s

      - name: Lint workflow YAML files
        run: |
          set -euo pipefail
          CFG="${{ runner.temp }}/workflow-yamllint.yaml"
          cat << 'EOF' > "$CFG"
          extends: default
          rules:
            line-length: disable
            document-start: disable
            truthy:
              allowed-values: ["true", "false", "on"]
          EOF
          yamllint -c "$CFG" .github/workflows
