name: Kubernetes Manifest Validate (Reusable)

on:
  workflow_call:
    inputs:
      yamllint-path:
        description: "yamllint を実行する対象パス（空の場合はスキップ）"
        type: string
        default: "k8s"
      prod-overlays:
        description: "prod 環境として検証する Kustomize オーバーレイパス（カンマまたは改行区切り、空の場合はスキップ）"
        type: string
        default: "k8s/overlays/prod"
      preview-overlays:
        description: "preview 環境として検証する Kustomize オーバーレイパス（カンマまたは改行区切り、空の場合はスキップ）"
        type: string
        default: "k8s/overlays/preview"
      enable-helm:
        description: "kustomize build に --enable-helm を付与するか"
        type: boolean
        default: false
      own-image-prefixes:
        description: "自前イメージとみなすプレフィックス（カンマ区切り）"
        type: string
        default: "ghcr.io/k-wa-wa/"
      exclude-helm-managed:
        description: "Helm 管理リソースをワークロード品質ポリシーから除外するか"
        type: boolean
        default: true
      fail-on-policy:
        description: "Conftest ポリシー違反時にジョブを失敗させるか（false の場合は警告サマリのみ出力する）"
        type: boolean
        default: true
      policy-ref:
        description: "ポリシー定義および検証スクリプト（run.sh）を取得する nuage-workspace の ref（workflow の ref と揃えること）"
        type: string
        default: "master"
      require-same-repo-pr:
        description: "fork からの PR ではジョブをスキップするかどうか"
        type: boolean
        default: true

jobs:
  validate:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    if: |
      (github.event_name != 'pull_request') ||
      (!inputs.require-same-repo-pr || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    env:
      KUSTOMIZE_VERSION: "v5.8.3"
      KUSTOMIZE_SHA256: "cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61"
      KUBECONFORM_VERSION: "v0.8.0"
      KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
      PLUTO_VERSION: "v5.24.5"
      PLUTO_SHA256: "80076e01a320e1f4db30f5dbc927d204e61cd8abed66fa0b4644ca61cd86b39e"
      CONFTEST_VERSION: "v0.71.1"
      CONFTEST_SHA256: "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985"
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4

      - name: Checkout Nuage K8s policies
        uses: actions/checkout@v4
        with:
          repository: k-wa-wa/nuage-workspace
          ref: ${{ inputs.policy-ref }}
          sparse-checkout: .github/workflows/validate/k8s
          path: .nuage-workspace-policies
          persist-credentials: false

      - name: Cache K8s validation binaries
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/nuage-k8s-tools
          key: nuage-k8s-tools-${{ runner.os }}-${{ env.KUSTOMIZE_VERSION }}-${{ env.KUBECONFORM_VERSION }}-${{ env.PLUTO_VERSION }}-${{ env.CONFTEST_VERSION }}

      - name: Install K8s validation tools
        run: |
          set -euo pipefail
          BIN_DIR="$HOME/.local/nuage-k8s-tools"
          mkdir -p "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"

          DL_DIR="${{ runner.temp }}/nuage-k8s-dl"
          mkdir -p "$DL_DIR"

          download_and_verify() {
            local url="$1"
            local expected_sha="$2"
            local out_file="$3"
            curl -sSfL "$url" -o "$out_file"
            echo "${expected_sha}  ${out_file}" | sha256sum -c -
          }

          if [ ! -x "$BIN_DIR/kustomize" ]; then
            download_and_verify \
              "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
              "$KUSTOMIZE_SHA256" \
              "$DL_DIR/kustomize.tar.gz"
            tar -xz -f "$DL_DIR/kustomize.tar.gz" -C "$BIN_DIR" kustomize
          fi

          if [ ! -x "$BIN_DIR/kubeconform" ]; then
            download_and_verify \
              "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
              "$KUBECONFORM_SHA256" \
              "$DL_DIR/kubeconform.tar.gz"
            tar -xz -f "$DL_DIR/kubeconform.tar.gz" -C "$BIN_DIR" kubeconform
          fi

          if [ ! -x "$BIN_DIR/pluto" ]; then
            PLUTO_VER_NO_V="${PLUTO_VERSION#v}"
            download_and_verify \
              "https://github.com/FairwindsOps/pluto/releases/download/${PLUTO_VERSION}/pluto_${PLUTO_VER_NO_V}_linux_amd64.tar.gz" \
              "$PLUTO_SHA256" \
              "$DL_DIR/pluto.tar.gz"
            tar -xz -f "$DL_DIR/pluto.tar.gz" -C "$BIN_DIR" pluto
          fi

          if [ ! -x "$BIN_DIR/conftest" ]; then
            CONFTEST_VER_NO_V="${CONFTEST_VERSION#v}"
            download_and_verify \
              "https://github.com/open-policy-agent/conftest/releases/download/${CONFTEST_VERSION}/conftest_${CONFTEST_VER_NO_V}_Linux_x86_64.tar.gz" \
              "$CONFTEST_SHA256" \
              "$DL_DIR/conftest.tar.gz"
            tar -xz -f "$DL_DIR/conftest.tar.gz" -C "$BIN_DIR" conftest
          fi

          rm -rf "$DL_DIR"

          if ! command -v yamllint >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends yamllint
          fi

          "$BIN_DIR/kustomize" version
          "$BIN_DIR/kubeconform" -v
          "$BIN_DIR/pluto" version
          "$BIN_DIR/conftest" --version
          yamllint --version

      - name: Run K8s validation
        env:
          YAMLLINT_PATH: ${{ inputs.yamllint-path }}
          PROD_OVERLAYS: ${{ inputs.prod-overlays }}
          PREVIEW_OVERLAYS: ${{ inputs.preview-overlays }}
          ENABLE_HELM: ${{ inputs.enable-helm }}
          OWN_IMAGE_PREFIXES: ${{ inputs.own-image-prefixes }}
          EXCLUDE_HELM_MANAGED: ${{ inputs.exclude-helm-managed }}
          FAIL_ON_POLICY: ${{ inputs.fail-on-policy }}
        run: .nuage-workspace-policies/.github/workflows/validate/k8s/run.sh
